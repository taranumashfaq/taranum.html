<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1> 
    <form action="https://roadmap.sh/">
        <p>Full Name</p>
        <input type="text" placeholder="Enter your name" required>

        <p>User Email</p>
        <input type="email" placeholder="Enter your email" required>

        <p>Password</p>
        <input type="password" placeholder="Enter your password" required><br>

        <p>Phone Number</p>
        <input type="phone number" placeholder="Enter your number" required><br>

        <p>Date of Birth</p>
        <input type="date of birth" placeholder="Enter your date of birth" required><br>

        <p>Address</p>
        <input type="address" placeholder="Enter your address" required><br>

        

        <p>Gender</p>
        <input type="radio" name="gender" value="male" required> Male
        <input type="radio" name="gender" value="female" required> Female<br>

        <p>Hobbies</p>
        <select name="hobbies" id="hobbies>
            <option value="reading">Reading</option>
            <option value="art/crafts">Art/Crafts</option>
            <option value="desinging">Desinging</option>
        </select>

        <p>Country</p>
        <select name="country" id="country">
            <option value="usa">United States</option>
            <option value="canada">Canada</option>
            <option value="uk">United Kingdom</option>
            <option value="australia">Australia</option>
            <option value="india">India</option>
            <option value="germany">Germany</option>
            <option value="pakistan">Pakistan</option>
            <option value="bahrain">Bahrain</option>
            <option value="other">Other</option>

        </select>
        <select name="city" id="city" required>
            <option value="newyork">New York</option>
            <option value="toronto">Toronto</option>
            <option value="london">London</option>
            <option value="sydney">Sydney</option>
            <option value="mumbai">Mumbai</option>
            <option value="berlin">Berlin</option>
            <option value="karachi">Karachi</option>
            <option value="manama">Manama</option>
            <option value="other">Other</option>

        </select>

        <p>Course Selection</p>
        <input type="checkbox" name="interest" value="web development" required> Web Development <br>
        <input type="checkbox" name="interest" value="app development" required> App Development<br>
        <input type="checkbox" name="interest" value="data science" required> Data Science<br>
        <input type="checkbox" name="interest" value="machine learning" required> Machine Learning<br>
        <input type="checkbox" name="interest" value="artificial intelligence" required> Artificial Intelligence<br>
        <input type="checkbox" name="interest" value="cloud computing" required> Cloud Computing<br>
        <input type="checkbox" name="interest" value="cyber security" required> Cyber Security<br>
        <input type="checkbox" name="interest" value="other" required> Other<br>

        <br>
        <button type="submit">Submit</button>

        <br>
        <button type="reset">Reset</button>
    <br/>
    <br/>
    <br/>

    </form>
</body>
</html>
